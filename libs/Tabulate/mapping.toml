[meta]
language = "python"
repo = "https://github.com/astanin/python-tabulate"
package = "tabulate"
version = ""
test_cmd = "pytest tests/"
mutation_cmd = "mutmut run --paths-to-mutate=tabulate/"

# --- Function specs ---

[[functions]]
lean = "tabulate"
ref = "tabulate.tabulate"
description = "tabulate"

[[functions]]
lean = "computeColumnWidths"
ref = "tabulate.compute_column_widths"
