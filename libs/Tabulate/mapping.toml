[[functions]]
lean = "formatHtml"
ref = "tabulate.format_html"
description = "formatHtml"

[[functions]]
lean = "tabulate_grid"
ref = "tabulate.tabulate_grid"
description = "tabulate grid"

[[functions]]
lean = "computeColumnWidths_length"
ref = "tabulate.compute_column_widths_length"
description = "computeColumnWidths length"

