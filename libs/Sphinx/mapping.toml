[meta]
language = "python"
repo = "https://github.com/sphinx-doc/sphinx"
package = "sphinx"
version = ""
test_cmd = "pytest tests/"
mutation_cmd = "mutmut run --paths-to-mutate=sphinx/"

# --- Function specs ---

[[functions]]
lean = "parseRst"
ref = "sphinx.parse_rst"
