[meta]
language = "python"
repo = "https://github.com/paramiko/paramiko"
package = "paramiko"
version = ""
test_cmd = "pytest tests/"
mutation_cmd = "mutmut run --paths-to-mutate=paramiko/"

# --- Function specs ---

[[functions]]
lean = "ChannelState.transition"
