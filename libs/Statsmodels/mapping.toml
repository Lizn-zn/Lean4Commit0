[meta]
language = "python"
repo = "https://github.com/statsmodels/statsmodels"
package = "statsmodels"
version = ""
test_cmd = "pytest tests/"
mutation_cmd = "mutmut run --paths-to-mutate=statsmodels/"

# --- Function specs ---

[[functions]]
lean = "olsFit"
ref = "statsmodels.ols_fit"
description = "olsFit"

[[functions]]
lean = "tTestOneSample"
ref = "statsmodels.t_test_one_sample"
description = "tTestOneSample"

[[functions]]
lean = "normalCdf"
ref = "statsmodels.normal_cdf"
description = "normalCdf"

# --- Relational specs ---

[[relational]]
spec = "normalCdf_monotone_rel"
chain = []
description = "normalCdf monotone"

[[relational]]
spec = "normalCdf_symmetry_rel"
chain = []
description = "normalCdf symmetry"

