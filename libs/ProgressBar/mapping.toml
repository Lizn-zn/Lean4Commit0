[meta]
language = "python"
repo = "https://github.com/WoLpH/python-progressbar"
package = "progressbar2"
version = ""
test_cmd = "pytest tests/"
mutation_cmd = "mutmut run --paths-to-mutate=progressbar2/"

# --- Function specs ---

[[functions]]
lean = "renderBar"
ref = "progressbar2.render_bar"
description = "renderBar"

[[functions]]
lean = "renderProgressBar"
ref = "progressbar2.render_progress_bar"
description = "renderProgressBar"

[[functions]]
lean = "computeETA"
ref = "progressbar2.compute_eta"
description = "computeETA"

