[meta]
language = "python"
repo = "https://github.com/pytest-dev/pytest"
package = "pytest"
version = ""
test_cmd = "pytest tests/"
mutation_cmd = "mutmut run --paths-to-mutate=pytest/"

# --- Function specs ---

[[functions]]
lean = "expandParametrize"
ref = "pytest.expand_parametrize"
description = "expandParametrize"

[[functions]]
lean = "resolveFixtures"
ref = "pytest.resolve_fixtures"
description = "resolveFixtures"

[[functions]]
lean = "summarizeReports"
ref = "pytest.summarize_reports"
description = "summarizeReports"

