[meta]
language = "python"
repo = "https://github.com/davidhalter/jedi"
package = "jedi"
version = ""
test_cmd = "pytest tests/"
mutation_cmd = "mutmut run --paths-to-mutate=jedi/"

# --- Function specs ---

[[functions]]
lean = "buildScopes"
