[meta]
language = "rust"
repo = "https://github.com/xacrimon/dashmap"
package = "dashmap"
version = ""
test_cmd = "cargo test"
mutation_cmd = "cargo mutants"

# --- Function specs ---

[[functions]]
lean = "DashMap.new"
ref = "dashmap::DashMap::new"
description = "DashMap new"

[[functions]]
