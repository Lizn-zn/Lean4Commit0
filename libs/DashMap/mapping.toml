description = "DashMap insert"

[[functions]]
lean = "DashMap.get"
ref = "dashmap::DashMap::get"
description = "DashMap get"

[[functions]]
lean = "DashMap.remove"
ref = "dashmap::DashMap::remove"
description = "DashMap remove"

