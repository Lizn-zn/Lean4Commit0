[meta]
language = "python"
repo = "https://github.com/fsspec/filesystem_spec"
package = "fsspec"
version = ""
test_cmd = "pytest tests/"
mutation_cmd = "mutmut run --paths-to-mutate=fsspec/"

# --- Function specs ---

[[functions]]
lean = "pathJoin"
ref = "fsspec.path_join"
description = "pathJoin"

[[functions]]
lean = "pathNormalize"
ref = "fsspec.path_normalize"
description = "pathNormalize"

[[functions]]
lean = "MemFS.put"
ref = "fsspec.MemFS.put"
description = "MemFS put"

# --- Relational specs ---

[[relational]]
spec = "pathJoin_pathSplit_roundtrip_rel"
chain = []
description = "pathJoin pathSplit roundtrip"

