[meta]
language = "python"
repo = "https://github.com/psf/requests"
package = "requests"
version = ""
test_cmd = "pytest tests/"
mutation_cmd = "mutmut run --paths-to-mutate=requests/"

# --- Function specs ---

[[functions]]
